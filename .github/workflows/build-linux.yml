name: Build Linux Packages

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Application tag or commit to package (empty uses the workflow ref)"
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            cache-key: linux-x86_64
          - runner: ubuntu-24.04-arm
            cache-key: linux-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || github.ref }}
      # A packaging repair can use current tooling with an immutable app tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: .github/scripts/install-tauri-rpm-cli.sh
          sparse-checkout-cone-mode: false
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf pkg-config libssl-dev xdg-utils
          perl -v
      - name: Install repository Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.cache-key }}
          save-if: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Tauri CLI with upstream RPM prerelease fix
        run: bash .release-tooling/.github/scripts/install-tauri-rpm-cli.sh
      - name: Check Connect build configuration
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_STORAGE_ALLOWED_HOSTS: ${{ secrets.CONNECT_STORAGE_ALLOWED_HOSTS }}
        run: python3 .github/scripts/check_connect_build.py --github-env

      - name: Build release-mode packages
        env:
          CONNECT_AUTH_URL: ${{ vars.CONNECT_AUTH_URL }}
          CONNECT_AUTH_PUBLISHABLE_KEY: ${{ vars.CONNECT_AUTH_PUBLISHABLE_KEY }}
          CONNECT_API_URL: ${{ vars.CONNECT_API_URL }}
          CONNECT_OAUTH_CALLBACK_URL: ${{ vars.CONNECT_OAUTH_CALLBACK_URL }}
        # Test packages do not need updater signatures or release credentials.
        run: >-
          cargo tauri build --ci --bundles appimage,deb,rpm --config
          '{"bundle":{"createUpdaterArtifacts":false}}' -- --locked
      - name: Record application source commit
        run: git rev-parse HEAD > target/release/source-${{ matrix.cache-key }}.txt
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: wealthfolio-${{ matrix.cache-key }}-${{ github.sha }}
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/source-${{ matrix.cache-key }}.txt
          if-no-files-found: error
          retention-days: 7
