name: auto-merge main into connector branch

# Keeps main-self-hosted-connector rebased on main without human action.
# This is the ONLY file that intentionally differs from upstream on main.
# All self-hosted work lives on main-self-hosted-connector; main stays clean.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *" # daily backstop in case a push event is missed
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout connector branch
        uses: actions/checkout@v4
        with:
          ref: main-self-hosted-connector
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-edit origin/main; then
            echo "merged=true" >> "$GITHUB_OUTPUT"
          else
            echo "merged=false" >> "$GITHUB_OUTPUT"
            git merge --abort
          fi

      - name: Push
        if: steps.merge.outputs.merged == 'true'
        run: git push origin main-self-hosted-connector

      - name: File conflict issue
        if: steps.merge.outputs.merged == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Auto-merge main → main-self-hosted-connector failed',
              body: `Merge commit on main (${context.sha}) conflicts with main-self-hosted-connector.\n\nRun log: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nResolve manually:\n\`git checkout main-self-hosted-connector && git merge origin/main\``,
            });
